[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools",
    "wheel",
]

[project]
authors = [
    { email = "louisbf6@gmail.com", name = "Louis Blazejczak" },
    { email = "chaim.leib.halbert@gmail.com", name = "Chaim Leib Halbert" },
    { name = "Konstantin Tretyakov" },
]
classifiers=[  # Get strings from http://pypi.python.org/pypi?%3Aaction=list_classifiers
'Development Status :: 5 - Production/Stable',
'Programming Language :: Python :: Implementation :: PyPy',
'Intended Audience :: Developers',
'Intended Audience :: Information Technology',
'Intended Audience :: Science/Research',
'Programming Language :: Python',
'Programming Language :: Python :: 2',
'Programming Language :: Python :: 2.7',
'Programming Language :: Python :: 3',
'Programming Language :: Python :: 3.6',
'Programming Language :: Python :: 3.7',
'Programming Language :: Python :: 3.8',
'Programming Language :: Python :: 3.9',
'Programming Language :: Python :: 3.10',
'Programming Language :: Python :: 3.11',
'Topic :: Scientific/Engineering :: Artificial Intelligence',
'Topic :: Scientific/Engineering :: Bio-Informatics',
'Topic :: Scientific/Engineering :: Information Analysis',
'Topic :: Software Development :: Libraries',
'Topic :: Text Processing :: General',
'Topic :: Text Processing :: Linguistic',
'Topic :: Text Processing :: Markup',
]
description = "Editable interval tree data structure for Python 3"
keywords = [
	"interval-tree",
	"data-structures",
	"intervals",
	"tree",
]
	license = "Apache-2.0"
name = "intervaltree"
version = "3.2.0.dev0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"sortedcontainers",
]
[project.optional-dependencies]
dev = [
	"iniconfig",
	"setuptools",
	"contextlib2",
	"configparser",
	"zipp",
	"pyparsing",
	"attrs",
	"importlib_metadata",
	"packaging",
	"pytest",
]
	[project.urls]
	Repository = "https://github.com/louisbzk/intervaltree"

[tool.pytest.ini_options]
addopts = [
    "--cov=.",
    "--showlocals",
]
markers = [
    "e2e: end-to-end tests",
    "ut: unit tests",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".egg_info",
    ".eggs",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
indent-width = 4
line-length = 88
target-version = "py310"

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
fixable = [
    "ALL",
]
ignore = []
select = [
    "B006",
    "B007",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "LOG",
    "PTH",
    "T20",
]
unfixable = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = [
    "docs",
    "docs.*",
    "tests",
    "tests.*",
]

[tool.zest.releaser]
no-input = true
push-changes = false
release = false
version-levels = 3

[tool.zest.releaser.postreleaser]
middle = "setup.postrealeaser_set_commit_msg"

[tool.zest.releaser.prereleaser]
middle = "setup.prereleaser_set_commit_msg"


